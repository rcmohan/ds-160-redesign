<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Prototype — Single Page with Pending Items</title>
<link rel="stylesheet" href="shared/style.css">
<style>
/* study bar (this page only): sits above the form and pushes the sticky columns down */
.studybar { position: sticky; top: 0; z-index: 45; background: #fff8e1; border-bottom: 2px solid #e0c25a; font-size: 13px; }
.studybar > div { max-width: 1440px; margin: 0 auto; padding: 6px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.studybar .code, .modal .code { font: 700 13px monospace; background: #fff; border: 1px solid #e0c25a; padding: 2px 8px; }
.studybar .grow { flex: 1; }
.side, .rside { top: 52px; }
.rside { max-height: calc(100vh - 52px); }
.row { scroll-margin-top: 150px; scroll-margin-bottom: 90px; }
.cpanel { scroll-margin-top: 64px; }
.codebox { width: 100%; font: 12px monospace; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body class="has-bar">
<div id="chrome"></div>
<div id="app-wrap"><div id="app"></div></div>
<div id="footer"></div>
<script src="shared/app.js"></script>
<script>
/* Final prototype: Option 2's single page + outline, with Option 3's pending-item tracking.
   1) Unanswered required questions are always marked in the form, outline and header badges.
   2) A pending-items panel links straight to each field.
   3) Review and Submit lives in one fixed action bar.
   4) Edits never re-flow the page, and every jump lands in the same screen position. */
const { h } = App;
const root = document.getElementById("app");
const resumed = App.init("option4");
App.chrome("Final Prototype");

/* =====================================================================
   Study logger (this page only). Records interaction events and task outcomes.
   It never records answer values, keystrokes or search text.
   Tasks (verified automatically; pressing "I'm done" is NOT treated as success):
     T1  correct the passport number              verified when the expected fictional value is entered
     T2  answer the previous-arrival date         verified when that date is complete
     T3  reload the page and recover saved work   verified when the page was reloaded during the task and saved changes were restored
     T4  review and submit                        verified when the simulated submission completes
   ===================================================================== */
const Study = (() => {
  const VERSION = "final-v1", KEY = "ds160-study-option4", IDLE_CAP = 30000, EVENT_CAP = 600;
  const EXPECTED_PASSPORT = "G4821935";
  const TASK_IDS = ["T1", "T2", "T3", "T4"];
  const iso = () => new Date().toISOString();
  const vp = () => innerWidth < 768 ? "mobile" : innerWidth < 1100 ? "tablet" : "desktop";
  const newId = () => {
    const a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", r = new Uint32Array(5); let o = "";
    try { crypto.getRandomValues(r); } catch (e) { for (let i = 0; i < 5; i++) r[i] = Math.random() * 4e9; }
    r.forEach(n => o += a[n % a.length]);
    return "eval-" + o;
  };
  const blankTask = () => ({ outcome: "not_started", verified: false, preSatisfied: false, activeMs: 0, wallStart: null, durationSeconds: null, wallSeconds: null,
    navigationActions: 0, validationErrors: 0, usedSearch: false, usedPendingPanel: false, reviewEditActions: 0, reloads: 0, savedStateRestored: null });
  function fresh() {
    const tasks = {}; TASK_IDS.forEach(id => tasks[id] = blankTask());
    return { sessionId: newId(), prototypeVersion: VERSION, startedAt: iso(), endedAt: null, viewportCategory: vp(), completedStudy: false,
      loads: 0, current: null, ms: 0, nav: 0, val: 0, failNav: null, recoverNav: null, submitted: false, tasks, events: [], dropped: 0 };
  }
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (!S || !S.tasks) S = fresh();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const T = id => S.tasks[id];
  const cur = () => S.current ? T(S.current) : null;

  /* active time: gaps between interactions longer than 30 s count as idle */
  let last = Date.now();
  function activity() {
    const t = Date.now(), d = Math.min(t - last, IDLE_CAP); last = t;
    S.ms += d; const c = cur(); if (c) c.activeMs += d;
    persist(); setTimeout(verify, 80);
  }
  function log(type, ref, extra) {
    if (S.events.length >= EVENT_CAP) { S.dropped++; return; }
    const c = cur();
    S.events.push({ t: S.current, e: type, r: ref || "", ms: c ? c.activeMs : S.ms, x: extra });
    persist();
  }
  /* a counted navigation action */
  function nav(type, ref, extra) {
    S.nav++;
    const c = cur();
    if (c) {
      c.navigationActions++;
      if (type === "question_search_used" || type === "search_result_selected") c.usedSearch = true;
      if (type === "pending_item_clicked" || type === "next_unanswered_clicked") c.usedPendingPanel = true;
    }
    log(type, ref, extra);
  }

  /* ---- verification ---- */
  const norm = v => String(v || "").replace(/\s/g, "").toUpperCase();
  const predicates = {
    T1: () => norm(App.answers.pnum) === EXPECTED_PASSPORT,
    T2: () => App.answered(App.findField("prev_arrival").field),
    T3: t => t.reloads >= 1 && t.savedStateRestored === true,
    T4: () => S.submitted === true,
  };
  function verify() {
    if (!S.current) return;
    const id = S.current, t = T(id);
    if (!t.verified && predicates[id](t)) {
      t.verified = true; t.durationSeconds = Math.round(t.activeMs / 1000);
      log("task_verified", id); persist();
    }
  }
  function start(id) {
    if (S.current) return;
    const t = T(id); t.outcome = "in_progress"; t.wallStart = Date.now(); S.current = id; last = Date.now();
    if (predicates[id](t)) { t.verified = true; t.preSatisfied = true; t.durationSeconds = 0; }   // flagged: already true before the task began
    log("task_started", id); persist(); drawStudy();
  }
  function finishTask() {
    const id = S.current; if (!id) return; const t = T(id);
    verify();
    t.wallSeconds = Math.round((Date.now() - t.wallStart) / 1000);
    if (!t.verified) t.durationSeconds = Math.round(t.activeMs / 1000);    // time until the participant said they were done
    t.outcome = t.verified ? "completed" : "not_verified";
    log("task_ended", id, t.verified ? "verified" : "unverified");
    S.current = null; persist(); drawStudy();
  }
  const nextTask = () => TASK_IDS.find(id => T(id).outcome === "not_started") || null;

  /* ---- saving and recovery ---- */
  const onSaveStarted = () => log("save_started");
  function onSaveSettled() {          // "confirmed" only if the stored copy really matches the current answers
    let ok = false;
    try { const st = JSON.parse(localStorage.getItem("ds160-option4")); ok = !!st && JSON.stringify(st.answers) === JSON.stringify(App.answers); } catch (e) {}
    log(ok ? "save_confirmed" : "save_failed");
  }
  function onLoad(resumedState) {
    S.loads++; last = Date.now();
    if (S.loads > 1) { log("page_reloaded"); const c = cur(); if (c) c.reloads++; }
    if (resumedState) {
      const keys = new Set([...Object.keys(SEED), ...Object.keys(App.answers)]); keys.delete("_later");
      const restored = [...keys].some(k => SEED[k] !== App.answers[k]);
      log("saved_state_restored", "", restored);
      const c = cur(); if (c && S.loads > 1) c.savedStateRestored = restored;
    }
    persist(); verify();
  }

  /* ---- review and submission ---- */
  function failedSubmit(missing) {
    S.val++; const c = cur(); if (c) c.validationErrors++;
    if (S.failNav === null) S.failNav = S.nav;
    log("submission_attempted", "", { ok: false, missing }); persist();
  }
  function completedSubmit() {
    log("submission_attempted", "", { ok: true });
    S.submitted = true;
    if (S.failNav !== null && S.recoverNav === null) S.recoverNav = S.nav - S.failNav;   // navigation actions from first failure to success
    log("simulated_submission_completed"); persist(); verify();
  }
  function reviewEdit() { const c = cur(); if (c) c.reviewEditActions++; persist(); }

  /* ---- summary and copy code ---- */
  /* The copy code is plain text a participant can read. It is built only from counts, durations, yes/no flags and fixed labels:
     no answers, no search text, no field names, no notes. Every value passes through safe(), which allows only [A-Za-z0-9._:-]. */
  const safe = v => v === null || v === undefined ? "-" : String(v).replace(/[^A-Za-z0-9._:-]/g, "?");
  const SHORT = { outline_section_clicked: "outline", question_search_used: "search", search_result_selected: "searchPick", pending_item_clicked: "pendingItem",
    next_unanswered_clicked: "nextUnanswered", section_expanded: "expand", section_collapsed: "collapse", review_opened: "review", missing_field_selected: "missingPick",
    review_edit_clicked: "reviewEdit", review_answer_edited: "reviewFixed", answer_modified: "edited", save_started: "saveStart", save_confirmed: "saveOk",
    save_failed: "saveFail", page_reloaded: "reload", submission_attempted: "submitTry", simulated_submission_completed: "submitDone" };
  function evCounts(taskId) {         // event counts, optionally for one task; only non-zero entries
    const o = {};
    S.events.forEach(e => { if ((taskId === undefined || e.t === taskId) && SHORT[e.e]) o[SHORT[e.e]] = (o[SHORT[e.e]] || 0) + 1; });
    return Object.keys(o).map(k => k + ":" + o[k]).join("/") || "-";
  }
  const fnv = str => { let x = 0x811c9dc5; for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(16).padStart(8, "0"); };
  const flag = v => v === null || v === undefined ? "-" : v ? 1 : 0;
  const stamp = s => s ? s.slice(0, 19) + "Z" : "-";
  function code() {                   // one readable line; the checksum lets the researcher detect a truncated paste
    const parts = ["DS160F1", "sid=" + S.sessionId, "ver=" + S.prototypeVersion, "vp=" + S.viewportCategory, "start=" + stamp(S.startedAt), "end=" + stamp(S.endedAt),
      "finished=" + flag(S.completedStudy), "nav=" + S.nav, "valErr=" + S.val, "navToRecover=" + safe(S.recoverNav), "reloads=" + Math.max(0, S.loads - 1)];
    TASK_IDS.forEach(id => {
      const t = T(id);
      parts.push(id + "[out=" + t.outcome + ",verified=" + flag(t.verified) + ",sec=" + safe(t.durationSeconds) + ",wall=" + safe(t.wallSeconds) + ",nav=" + t.navigationActions +
        ",valErr=" + t.validationErrors + ",search=" + flag(t.usedSearch) + ",pending=" + flag(t.usedPendingPanel) + ",reviewEdits=" + t.reviewEditActions +
        ",reloads=" + t.reloads + ",restored=" + flag(t.savedStateRestored) + ",pre=" + flag(t.preSatisfied) + ",ev=" + evCounts(id) + "]");
    });
    parts.push("evAll=" + evCounts());
    const body = parts.join(";").replace(/[^A-Za-z0-9._:;=,\[\]\/-]/g, "?");   // final guard: nothing outside this alphabet can leave the page
    return body + ";chk=" + fnv(body);
  }
  function endStudy() {
    S.endedAt = iso(); S.viewportCategory = vp();
    S.completedStudy = !S.current && TASK_IDS.every(id => !["not_started", "in_progress"].includes(T(id).outcome));
    persist();
  }
  const reset = () => { try { localStorage.removeItem(KEY); } catch (e) {} };
  return { S: () => S, activity, log, nav, start, finishTask, nextTask, onSaveStarted, onSaveSettled, onLoad, failedSubmit, completedSubmit, reviewEdit, code, endStudy, reset };
})();

/* ---- study bar: explicit task start / done boundary ---- */
const studyBar = h("div", { class: "studybar", role: "region", "aria-label": "Study controls" });
document.getElementById("app-wrap").insertBefore(studyBar, root);
function drawStudy() {
  const S = Study.S(); studyBar.innerHTML = "";
  const n = Study.nextTask(), c = S.current;
  const inner = h("div", {}, h("span", {}, "Study session ", h("span", { class: "code" }, S.sessionId)), h("span", { class: "grow" }));
  if (c) inner.append(h("span", {}, "Task " + c.slice(1) + " of 4 in progress"), h("button", { class: "sbtn fill", onclick: () => Study.finishTask() }, "I'm done with Task " + c.slice(1)));
  else if (n) inner.append(h("span", {}, "Task " + n.slice(1) + " of 4: read the task in your questionnaire, then start."), h("button", { class: "sbtn fill", onclick: () => Study.start(n) }, "Start Task " + n.slice(1)));
  else inner.append(h("span", {}, "All tasks finished."), h("button", { class: "sbtn fill", onclick: showFinish }, "Finish study and copy results"));
  studyBar.append(inner);
}
function showFinish() {
  Study.endStudy();
  const code = Study.code(), S = Study.S();
  const ta = h("textarea", { class: "codebox", readonly: "", rows: 6, "aria-label": "Results code" }); ta.value = code;
  const msg = h("span", { role: "status", style: "margin-left:10px;color:#2e7d32;font-weight:700" });
  const copy = () => {
    ta.focus(); ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => msg.textContent = "Copied.", () => {
      let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      msg.textContent = ok ? "Copied." : "Select the code and press Ctrl+C.";
    });
  };
  const scrim = h("div", { class: "scrim" }, h("div", { class: "modal", style: "max-width:640px" },
    h("h3", {}, "Finish study"),
    h("p", {}, "Your session code is ", h("span", { class: "code" }, S.sessionId), ". Enter it in the questionnaire."),
    h("p", {}, "Copy the results code below and paste it, unchanged, into the questionnaire's results field. You can read it: it holds only your session code, timings, click counts and task outcomes. It does not contain any answers you entered, anything you typed into search, or any personal information."),
    ta, h("div", { style: "font-size:12px;color:#666;margin-top:4px" }, code.length + " characters" + (S.completedStudy ? "" : " · not all tasks were finished")),
    h("div", { class: "btnbar" }, h("button", { class: "rbtn c", onclick: copy }, "Copy results code"), h("button", { class: "rbtn c", onclick: () => scrim.remove() }, "Close")), msg));
  document.body.append(scrim); ta.focus(); ta.select();
}
/* footer: Reset also clears the study session; add a finish link */
document.getElementById("resetbtn").onclick = () => {
  if (confirm("Reset this prototype and the study session?")) { Study.reset(); try { localStorage.removeItem("ds160-scroll-option4"); } catch (e) {} App.reset(); }
};
document.querySelector("#footer .footer").append(document.createTextNode("   "), h("button", { class: "link", onclick: showFinish }, "Finish study and copy results"));

/* interaction capture: active time, and "answer modified" without its value */
["click", "keydown", "input", "change"].forEach(ev => document.addEventListener(ev, Study.activity, true));
const lastMod = {}; let reviewEditField = null;
function onModified(e) {
  const t = e.target; if (!t || t.tagName === "TEXTAREA") return;
  const row = t.closest && t.closest(".row"); if (!row || !row.id.startsWith("row_")) return;
  const id = row.id.slice(4), now = Date.now();
  if (lastMod[id] && now - lastMod[id] < 4000) return;
  lastMod[id] = now;
  Study.log("answer_modified", id);
  if (reviewEditField === id) { Study.log("review_answer_edited", id); reviewEditField = null; }
}
document.addEventListener("input", onModified, true);
document.addEventListener("change", onModified, true);

const indicator = App.saveIndicator();
/* save events come from the same indicator the user sees, but "confirmed" is checked against storage */
(function () {
  const orig = indicator.update; let saving = false;
  indicator.update = mode => {
    orig(mode);
    if (mode === "saving" && !saving) { saving = true; Study.onSaveStarted(); }
    if (mode === "saved") { saving = false; Study.onSaveSettled(); }
  };
})();

const L = App.answers._later;                      // optional per-question notes: { fieldId: { note } }

if (!App.meta.open) { App.meta.open = {}; SECTIONS.forEach(s => App.meta.open[s.id] = App.stats(s).status !== "done"); }
let hit = new Set(), editingNote = null, cursor = null, curSection = SECTIONS[0].id;

const outline = h("nav", { class: "side", "aria-label": "Application outline" });
const main = h("div", { class: "main" });
const rside = h("aside", { class: "rside", "aria-label": "Pending items" });
root.append(h("div", { class: "shell" }, outline, main, rside));

const searchInput = h("input", { type: "text", id: "q", placeholder: "Type to search all questions and answers", autocomplete: "off", "aria-label": "Find a question or answer" });
const results = h("div", { class: "results", hidden: true });
const panelsBox = h("div");
const bodies = {}, heads = {};
main.append(
  h("div", { class: "search" }, h("label", { class: "lbl", for: "q", style: "font-weight:700" }, "Find a question or answer"), searchInput, results),
  h("h2", { class: "title" }, "Online Nonimmigrant Visa Application"),
  panelsBox);

/* ---- fixed action bar: the one place for save / pending / review ---- */
const pendBtn = h("button", { class: "sbtn", onclick: () => nextPending("action_bar") });
const bar = h("div", { class: "actionbar" }, h("div", {},
  indicator, h("span", { class: "grow" }), pendBtn,
  h("button", { class: "rbtn", style: "background:#fff;color:var(--red);border:1px solid var(--red)", onclick: () => App.save() }, "💾 Save"),
  h("button", { class: "rbtn", onclick: openReview }, "Review and Submit ▶")));
document.body.append(bar);

/* ---- panels ---- */
SECTIONS.forEach(s => {
  const body = h("div", { class: "cbody" });
  const head = h("button", { class: "chead", "aria-expanded": "false", onclick: () => toggle(s.id) });
  bodies[s.id] = body; heads[s.id] = head;
  panelsBox.append(h("section", { class: "cpanel", id: "sec_" + s.id }, h("h3", { style: "margin:0" }, head), body));
});
const sec = id => SECTIONS.find(s => s.id === id);
const badgeText = st => st.missing.length ? st.missing.length + " unanswered" : App.label[st.status];

function drawPanel(s) {
  const open = !!App.meta.open[s.id], st = App.stats(s);
  const head = heads[s.id];
  head.setAttribute("aria-expanded", open);
  head.innerHTML = "";
  head.append(h("span", { class: "caret" }, open ? "▼" : "▶"), s.title, h("span", { class: "badge " + st.status }, badgeText(st)));
  bodies[s.id].hidden = !open;
  if (!open) return;
  bodies[s.id].innerHTML = "";
  if (s.note) bodies[s.id].append(h("div", { class: "note" }, "NOTE: " + s.note));
  const box = h("div", { class: "panel" });
  bodies[s.id].append(box);
  App.renderSection(box, s, { hit, persist: true, extra: noteUI });
}

/* optional note on an unanswered question, shown again in the pending panel */
function noteUI(f) {
  if (App.answered(f) || !f.required) return null;
  const n = L[f.id];
  if (editingNote === f.id) {
    const ta = h("textarea", { rows: 2, "aria-label": "Note for this question", placeholder: "e.g., Ask family member" }, n ? n.note : "");
    return h("div", { class: "rnote" }, ta, h("div", { style: "margin-top:4px;display:flex;gap:6px" },
      h("button", { class: "sbtn fill", onclick: () => { const v = ta.value.trim(); v ? L[f.id] = { note: v } : delete L[f.id]; editingNote = null; App.save(); refresh(); } }, "Save note"),
      h("button", { class: "sbtn", onclick: () => { editingNote = null; refresh(); } }, "Cancel")));
  }
  return h("div", { class: "rnote" }, n ? ["Note: " + n.note + " "] : null,
    h("button", { class: "link", onclick: () => { editingNote = f.id; refresh(); setTimeout(() => { const t = document.querySelector("#row_" + f.id + " textarea"); if (t) t.focus({ preventScroll: true }); }, 30); } }, n ? "Edit note" : "Add a note for later"));
}

function drawOutline() {
  outline.innerHTML = "";
  const o = App.overall(), pend = App.pendingAll().length;
  outline.append(h("div", { style: "font-size:13px;color:#444" }, o.pct + "% answered · " + pend + " pending"), h("div", { class: "progress" }, h("i", { style: "width:" + o.pct + "%" })));
  const ul = h("ul", { class: "nav" });
  SECTIONS.forEach(s => {
    const st = App.stats(s);
    ul.append(h("li", {}, h("button", { "data-sec": s.id, class: (st.status === "done" ? "" : st.status === "part" ? "part" : "todo") + (s.id === curSection ? " cur" : ""), onclick: () => { Study.nav("outline_section_clicked", s.id); goTo(s.id); } },
      h("span", { class: "ic" }, st.status === "done" ? "✔" : st.status === "part" ? "●" : ""), h("span", {}, s.short),
      h("span", { class: "cnt" }, st.missing.length ? st.missing.length + " left" : "Done"))));
  });
  outline.append(ul, h("div", { style: "display:flex;gap:6px;margin-top:12px" },
    h("button", { class: "sbtn", onclick: () => setAll(true) }, "Expand all"), h("button", { class: "sbtn", onclick: () => setAll(false) }, "Collapse all")));
}

/* pending-items summary */
function drawPending() {
  rside.innerHTML = "";
  const all = App.pendingAll();
  pendBtn.textContent = all.length ? all.length + " pending — go to next" : "No pending items";
  pendBtn.disabled = !all.length;
  const box = h("div", { class: "pbox" }, h("h3", {}, "Pending items", h("span", { class: "badge " + (all.length ? "part" : "done") }, String(all.length))));
  const body = h("div", { class: "pbody" });
  if (!all.length) body.append(h("p", { style: "margin:8px 0" }, "All required questions are answered."), h("button", { class: "rbtn", style: "width:100%", onclick: openReview }, "Review and Submit"));
  else {
    body.append(h("button", { class: "rbtn", style: "width:100%;margin-top:6px", onclick: () => nextPending("panel") }, "Go to next unanswered ▶"));
    SECTIONS.forEach(s => {
      const m = App.stats(s).missing; if (!m.length) return;
      body.append(h("div", { class: "pgroup" }, h("span", {}, s.short), h("span", {}, String(m.length))));
      m.forEach(f => body.append(h("button", { class: "pitem", onclick: () => { Study.nav("pending_item_clicked", f.id); goTo(s.id, f.id); } }, f.label, L[f.id] ? h("small", {}, "Note: " + L[f.id].note) : null)));
    });
  }
  box.append(body); rside.append(box);
}

/* ---- keeping the view stable ---- */
function drawAll() { SECTIONS.forEach(drawPanel); drawOutline(); drawPending(); }
function refresh() { const y = window.scrollY; drawAll(); window.scrollTo(0, y); }      // redraw without moving the page
App.state.onChange = refresh;
/* typing: update marks and counters in place, never rebuild the field being edited */
App.state.onInput = () => {
  SECTIONS.forEach(s => {
    const st = App.stats(s), b = heads[s.id].querySelector(".badge");
    if (b) { b.className = "badge " + st.status; b.textContent = badgeText(st); }
    s.fields.forEach(f => {
      const row = document.getElementById("row_" + f.id); if (!row) return;
      const un = f.required && App.visible(f) && !App.answered(f), tag = row.querySelector(".unans-tag");
      row.classList.toggle("unans", un);
      if (!un && tag) tag.remove();
    });
  });
  drawOutline(); drawPending();
};

/* one scroll rule for every jump: target lands just below the top edge (see scroll-margin in CSS) */
function scrollToEl(el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); }
function goTo(id, fieldId) {
  const wasOpen = App.meta.open[id];
  App.meta.open[id] = true;
  if (!wasOpen) { App.save(); drawPanel(sec(id)); drawOutline(); }
  if (fieldId) {
    cursor = fieldId;
    const row = document.getElementById("row_" + fieldId);
    if (row) {
      scrollToEl(row); row.classList.add("flash");
      const i = row.querySelector("input:not([disabled]),select"); if (i) i.focus({ preventScroll: true });
      setTimeout(() => row.classList.remove("flash"), 1700);
    }
  } else scrollToEl(document.getElementById("sec_" + id));
}
function nextPending(source) {
  const all = App.pendingAll(); if (!all.length) return;
  let i = all.findIndex(x => x.field.id === cursor);
  i = i < 0 ? 0 : (i + 1) % all.length;
  Study.nav("next_unanswered_clicked", all[i].field.id, source);
  goTo(all[i].section.id, all[i].field.id);
}
function toggle(id) {
  App.meta.open[id] = !App.meta.open[id];
  Study.nav(App.meta.open[id] ? "section_expanded" : "section_collapsed", id);
  App.save(); drawPanel(sec(id));
}
function setAll(v) { Study.nav(v ? "section_expanded" : "section_collapsed", "all"); SECTIONS.forEach(s => App.meta.open[s.id] = v); App.save(); refresh(); }

/* current section follows the scroll position */
let ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    let cur = SECTIONS[0].id;
    SECTIONS.forEach(s => { const el = document.getElementById("sec_" + s.id); if (el && el.getBoundingClientRect().top <= 160) cur = s.id; });
    if (cur !== curSection) { curSection = cur; outline.querySelectorAll("button[data-sec]").forEach(b => b.classList.toggle("cur", b.dataset.sec === cur)); }
  });
}, { passive: true });

/* ---- search ---- */
let searchTimer = null, lastSearchLog = 0;
function logSearch(len, count) {          // records that search was used and how many results it had; the text and its length are never stored
  clearTimeout(searchTimer);
  if (len < 2) return;
  searchTimer = setTimeout(() => { if (Date.now() - lastSearchLog > 2500) { lastSearchLog = Date.now(); Study.nav("question_search_used", "", { results: count }); } }, 1200);
}
function runSearch(jumpFirst) {
  const q = searchInput.value.trim();
  results.innerHTML = "";
  if (!q) { results.hidden = true; if (hit.size) { hit = new Set(); refresh(); } return; }
  const r = App.search(q);
  if (!jumpFirst) logSearch(q.length, r.length);
  results.hidden = false;
  if (!r.length) { results.append(h("div", { class: "none" }, "No matching questions or answers.")); return; }
  r.slice(0, 8).forEach((x, rank) => {
    const ans = App.answerText(x.field);
    results.append(h("button", { onclick: () => { Study.nav("search_result_selected", x.field.id, rank + 1); hit = new Set([x.field.id]); results.hidden = true; App.meta.open[x.section.id] = true; refresh(); goTo(x.section.id, x.field.id); } },
      x.field.label, h("br"), h("small", {}, x.section.title + (ans ? " · Answer: " + ans : " · Not answered"))));
  });
  if (jumpFirst) { const t = r[0]; Study.nav("search_result_selected", t.field.id, "enter"); hit = new Set([t.field.id]); results.hidden = true; App.meta.open[t.section.id] = true; refresh(); goTo(t.section.id, t.field.id); }
}
searchInput.addEventListener("input", () => runSearch(false));
searchInput.addEventListener("keydown", e => { if (e.key === "Enter") runSearch(true); if (e.key === "Escape") results.hidden = true; });
document.addEventListener("click", e => { if (!e.target.closest(".search")) results.hidden = true; });

/* ---- review and submit (dialog: opening it never moves the page) ---- */
function openReview() {
  let pend = App.pendingAll();
  Study.nav("review_opened");
  if (pend.length) Study.log("missing_fields_shown", "", pend.length);
  let done = false, failed = false;
  const scrim = h("div", { class: "scrim", onclick: e => { if (e.target === scrim) scrim.remove(); } });
  function draw() {
    scrim.innerHTML = "";
    const m = h("div", { class: "modal", role: "dialog", "aria-labelledby": "rt", style: "max-width:760px" }, h("h3", { id: "rt" }, "Review and Submit"));
    if (done) m.append(h("p", { style: "color:var(--ok);font-weight:700" }, "Simulated submission complete. No data was sent anywhere."));
    else {
      m.append(h("p", { style: pend.length ? "color:var(--red)" : "", role: failed ? "alert" : null }, pend.length
        ? (failed ? "Cannot submit yet: " : "") + pend.length + " required question" + (pend.length > 1 ? "s" : "") + " still need an answer. Select Answer to go to it."
        : "All required questions are answered. Please check your answers below before submitting."));
      /* every answer, by section, each with a direct link back to the field */
      SECTIONS.forEach(s => {
        const st = App.stats(s);
        const tb = h("tbody");
        s.fields.filter(App.visible).forEach(f => {
          const ans = App.answerText(f), miss = f.required && !App.answered(f);
          tb.append(h("tr", { style: miss ? "background:#fffaf0" : "" },
            h("td", { style: "width:46%" }, f.label),
            h("td", {}, ans ? ans : h("i", { style: miss ? "color:#8a5300;font-weight:700" : "color:#888" }, miss ? "Not answered" : "Not provided")),
            h("td", { style: "text-align:right;white-space:nowrap" }, h("button", { class: "sbtn" + (miss ? " fill" : ""), onclick: () => {
              if (miss) Study.nav("missing_field_selected", f.id);
              else { Study.nav("review_edit_clicked", f.id); Study.reviewEdit(); reviewEditField = f.id; }
              scrim.remove(); goTo(s.id, f.id); } }, miss ? "Answer" : "Edit"))));
        });
        m.append(h("div", { style: "display:flex;align-items:center;gap:10px;margin:16px 0 6px" },
          h("b", { style: "font:18px Georgia,serif;color:var(--navy-text)" }, s.title), h("span", { class: "badge " + st.status }, badgeText(st))),
          h("table", { class: "t" }, tb));
      });
    }
    m.append(h("div", { class: "btnbar", style: "position:sticky;bottom:-22px" },
      h("button", { class: "rbtn c", onclick: () => scrim.remove() }, done ? "Close" : "Keep editing"),
      done ? null : h("button", { class: "rbtn c", onclick: () => {
        pend = App.pendingAll();
        if (pend.length) { failed = true; Study.failedSubmit(pend.length); }
        else { done = true; Study.completedSubmit(); }
        draw(); } }, "Submit Application")));
    scrim.append(m);
  }
  draw(); document.body.append(scrim);
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { const s = document.querySelector(".scrim"); if (s) s.remove(); } });

/* ---- return to the same place after an interruption ---- */
const SK = "ds160-scroll-option4";
window.addEventListener("pagehide", () => { try { localStorage.setItem(SK, String(window.scrollY)); } catch (e) {} });
drawAll();
drawStudy();
Study.onLoad(resumed);
try {
  const y = parseFloat(localStorage.getItem(SK));
  if (resumed && y > 0) requestAnimationFrame(() => window.scrollTo(0, y));
  if (!resumed) localStorage.removeItem(SK);
} catch (e) {}
</script>
</body>
</html>
